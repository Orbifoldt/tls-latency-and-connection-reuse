events {}

http {
    upstream fastapi {
        server 127.0.0.1:9080;
    }

    server {
        listen 8080;
        server_name localhost;

        # Redirect all HTTP requests to HTTPS
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /run/tls/fullchain.cert.pem;
        ssl_certificate_key /run/tls/localhost.key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;  # Preserve the original hostname
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 8442 ssl;
        server_name localhost;

        ssl_certificate     /run/tls-revoked/fullchain.cert.pem;
        ssl_certificate_key /run/tls-revoked/localhost-revoked-crl.key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://fastapi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
